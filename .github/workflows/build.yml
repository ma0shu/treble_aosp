name: Build

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to test'
        default: 'treble_arm64_bgN'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      # ----------------------------------------------------
      # 1. 新增：安装 AOSP 编译依赖
      # ----------------------------------------------------
      - name: Install AOSP Dependencies
        run: |
          echo "Starting dependency installation..."
          # 释放磁盘空间 (GitHub Actions runner 空间有限)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          
          sudo apt-get update
          # 安装 AOSP 14/15/16 所需的核心依赖
          # 我们指定 openjdk-17-jdk, 因为 ponces 的仓库在编译 Android 16
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev openjdk-17-jdk python-is-python3 \
            libncurses-dev
          echo "Dependencies installed."
          df -h

      # ----------------------------------------------------
      # 2. 新增：安装 'repo' 工具
      # ----------------------------------------------------
      - name: Install repo tool
        run: |
          echo "Installing repo tool..."
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          # 把 ~/bin 添加到 PATH 环境变量
          echo "$HOME/bin" >> $GITHUB_PATH
          echo "repo tool installed."

      - name: Setup Environment
        run: |
          git lfs install
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p ${{ github.workspace }}/aosp

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ./aosp/treble_aosp
          
      - name: Build ROM
        run: ./treble_aosp/build.sh
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          BUILD_VARIANT: ${{ inputs.build_variant }}
        working-directory: ${{ github.workspace }}/aosp

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_variant }}
          path: ${{ github.workspace }}/output/*.xz
