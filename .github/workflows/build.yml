name: Build

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant to test'
        default: 'treble_arm64_bgN'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    # ----------------------------------------------------
    # 1. 这里是关键修改：
    #    把 'self-hosted' 改成 'ubuntu-latest'
    #    来使用 GitHub 的免费公用 Runner
    # ----------------------------------------------------
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./

      # ----------------------------------------------------
      # 2. 这里是第二处修改：
      #    删除了所有和私有密钥 (secrets) 相关的 SSH 命令
      #    只保留了必要的部分
      # ----------------------------------------------------
      - name: Setup Environment
        run: |
          git lfs install
          # 把作者的个人信息改成通用的 CI 机器人信息
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          mkdir -p ${{ github.workspace }}/aosp

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ./aosp/treble_aosp

      # ----------------------------------------------------
      # 3. 这里是第三处修改：
      #    整个 'Start SSH Agent' 步骤都必须删除
      #    因为它依赖你没有的私钥 (secrets)
      # ----------------------------------------------------
      # (原有的 'Start SSH Agent' 步骤已删除)

      - name: Build ROM
        run: ./treble_aosp/build.sh
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          BUILD_VARIANT: ${{ inputs.build_variant }}
        working-directory: ${{ github.workspace }}/aosp

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_variant }}
          path: ${{ github.workspace }}/output/*.xz
